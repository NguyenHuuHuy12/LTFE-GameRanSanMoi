<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Snake san moi</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.6.2/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.2/css/bootstrap.min.css">
</head>
<body>
<div class="container-khung">
    <div class="container-thanhthongtin">
        <div class="col o-tt"><i class="fa-solid fa-map-location-dot"></i>Màn <b id="soman">1</b>/<span id="tongman">4</span></div>
        <div class="col o-tt"><i class="fa-solid fa-apple-whole"></i> <b id="somoi">0</b>/<span id="tongsomoi">5</span></div>
        <div class="col o-tt"><i class="fa-solid fa-start"></i> <b id="diem">0</b></div>
        <div class="col ky-luc"><i class="fa-solid fa-trophy"></i> <b id="kyluc">0</b></div>
        <div class="col button">
            <button id="nut-dung" type="button" class="btn-pause"><i class="fa-solid fa-stop"></i></button>
            <button id="nut-qua-man" type="button" class="btn-next"><i class="fa-solid fa-next"></i></button>
        </div>
    </div>


<div class="d-flex align-items-center do-kho">
    <span class="mr-2">Độ khó</span>
    <div class="progress flex-grow-1">
        <div id="vach-do-kho" class="progress-bar bg-success" role="progressbar" style="width: 0%" ></div>
    </div>
    <b id="so-do-kho" class="ml-2">0%</b>
</div>

<div id="khung-ban" class="khung-ban">
    <div id="ban" class="ban"></div>
</div>

<div class="phim-di-chuyen d-md-none">
    <button type="button" class="btn" data-h="len"><i class="fa-solid fs-chevron-up"></i></button>
    <button type="button" class="btn" data-h="xuong"><i class="fa-solid fs-chevron-down"></i></button>
    <button type="button" class="btn" data-h="trai"><i class="fa-solid fs-chevron-left"></i></button>
    <button type="button" class="btn" data-h="phai"><i class="fa-solid fs-chevron-right"></i></button>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.2/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
